[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phcodeswitch-leaderboard"
version = "1.0.0"
description = "ASR benchmarking leaderboard for Cebuano-English code-switched speech"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Eric John Emberda"},
]
keywords = ["asr", "whisper", "speech-recognition", "cebuano", "leaderboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "librosa>=0.9.0",
    "jiwer>=3.0.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/eemberda/phcodeswitch-leaderboard"
Repository = "https://github.com/eemberda/phcodeswitch-leaderboard"
"Dataset" = "https://github.com/eemberda/phcodeswitch-dataset"

[project.scripts]
phcodeswitch-leaderboard = "phcodeswitch_leaderboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["phcodeswitch_leaderboard*"]

[tool.setuptools.package-data]
phcodeswitch_leaderboard = ["config/*.json"]
